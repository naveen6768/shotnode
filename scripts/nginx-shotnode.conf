# Domain HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name shotnode.pro www.shotnode.pro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shotnode/dist;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://shotnode.pro$request_uri;
    }
}

# IP / unknown host HTTP: serve site directly (DNS-propagation fallback).
# Must NOT claim default_server — fungame.conf already owns :80/:443 default_server.
server {
    listen 80;
    listen [::]:80;
    server_name 8.234.80.80 api.8.234.80.80.sslip.io;

    root /var/www/shotnode/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

# www HTTPS -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shotnode.pro;

    ssl_certificate /etc/letsencrypt/live/shotnode.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shotnode.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://shotnode.pro$request_uri;
}

# apex HTTPS (no default_server — fungame owns :443 default)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shotnode.pro;

    ssl_certificate /etc/letsencrypt/live/shotnode.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shotnode.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/shotnode/dist;
    index index.html;

    # SPA shell must revalidate so deploys are not stuck behind cached index.html.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Unified backend (publish, catalogs, templates, /me, …)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
