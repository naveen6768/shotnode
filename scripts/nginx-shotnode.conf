# Domain HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name shotnode.pro www.shotnode.pro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shotnode/dist;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://shotnode.pro$request_uri;
    }
}

# IP / unknown host HTTP: serve site directly (DNS-propagation fallback)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/shotnode/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

# www HTTPS -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shotnode.pro;

    ssl_certificate /etc/letsencrypt/live/shotnode.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shotnode.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://shotnode.pro$request_uri;
}

# apex + default HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name shotnode.pro _;

    ssl_certificate /etc/letsencrypt/live/shotnode.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shotnode.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/shotnode/dist;
    index index.html;

    # Unified backend (publish, catalogs, templates, /me, …)
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
