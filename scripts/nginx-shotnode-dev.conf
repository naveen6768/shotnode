# Development marketing site + API (no SSL required — use port 8088 until DNS exists).
# After DNS for dev.shotnode.pro → VM IP, expand certbot and add a 443 block.

server {
    listen 8088;
    listen [::]:8088;
    server_name dev.shotnode.pro _;

    root /var/www/shotnode-dev/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shotnode-dev/dist;
        default_type "text/plain";
        allow all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

# Optional HTTP hostname front-door (when DNS points here).
server {
    listen 80;
    listen [::]:80;
    server_name dev.shotnode.pro;

    root /var/www/shotnode-dev/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shotnode-dev/dist;
        default_type "text/plain";
        allow all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
