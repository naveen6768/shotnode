# Included inside the existing shotnode.pro TLS vhost on shotnode-production.
# Keep its /api/ and /static/ routes intact.
location = /blog {
    proxy_pass http://127.0.0.1:3020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 /index.html;
}

# Use a plain prefix so the image regex below can serve local blog artwork.
location /blog/ {
    proxy_pass http://127.0.0.1:3020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 /index.html;
}

location ~* ^/blog/.*\.(?:jpg|jpeg|png|svg|webp)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
}

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3020;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}

location ^~ /sitemap- {
    proxy_pass http://127.0.0.1:3020;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}
