  <text x="78" y="220" fill="#FBF8EC" font-family="Georgia,serif" font-size="78">The first</text><text x="78" y="307" fill="#FBF8EC" font-family="Georgia,serif" font-style="italic" font-size="78">three seconds.</text>
  <text x="80" y="386" fill="#32483D" font-family="Arial,sans-serif" font-size="24" letter-spacing="1">Make a promise. Then keep it.</text>
