<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title">
  <title id="title">The first three seconds</title>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#BAC8A1"/><stop offset="1" stop-color="#657A62"/></linearGradient><linearGradient id="screen" x2="0" y2="1"><stop stop-color="#D5E6C4"/><stop offset="1" stop-color="#89A27C"/></linearGradient></defs>
